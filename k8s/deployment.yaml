apiVersion: apps/v1
kind: Deployment
metadata:
  name: retell-webhook-processor
  namespace: default
  labels:
    app: retell-webhook-processor
    version: v1
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: retell-webhook-processor
  template:
    metadata:
      labels:
        app: retell-webhook-processor
        version: v1
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/health"
    spec:
      # serviceAccountName: retell-webhook-processor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: retell-webhook-processor
          image: ivansscrobot/ardent-ms-retell-processor:0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP

          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: retell-processor-config

          # Environment variables from Secret
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: retell-processor-secrets
                  key: OLLAMA_API_KEY
                  optional: true
            - name: ODOO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: retell-processor-secrets
                  key: ODOO_API_KEY

          # Resource limits and requests
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "2Gi"

          # Health checks
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health/startup
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL

          # Volume mounts for temporary files
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp

      # Volumes
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}

      # Pod disruption settings
      terminationGracePeriodSeconds: 30

      # # Node selection (optional)
      # nodeSelector:
      #   kubernetes.io/os: linux

      # Tolerations (optional)
      # tolerations:
      #   - key: "node.kubernetes.io/not-ready"
      #     operator: "Exists"
      #     effect: "NoExecute"
      #     tolerationSeconds: 300
      #   - key: "node.kubernetes.io/unreachable"
      #     operator: "Exists"
      #     effect: "NoExecute"
      #     tolerationSeconds: 300

      # Affinity rules for better distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - retell-webhook-processor
                topologyKey: kubernetes.io/hostname
---
# ServiceAccount for the deployment
# apiVersion: v1
# kind: ServiceAccount
# metadata:
#   name: retell-webhook-processor
#   namespace: default
#   labels:
#     app: retell-webhook-processor
# automountServiceAccountToken: false
---
# PodDisruptionBudget to ensure availability during updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: retell-webhook-processor-pdb
  namespace: default
  labels:
    app: retell-webhook-processor
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: retell-webhook-processor
