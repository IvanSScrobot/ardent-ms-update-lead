apiVersion: v1
kind: Service
metadata:
  name: retell-webhook-processor-service
  namespace: default
  labels:
    app: retell-webhook-processor
    component: service
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  #   service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: retell-webhook-processor
  sessionAffinity: None
