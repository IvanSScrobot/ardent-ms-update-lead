apiVersion: v1
kind: Secret
metadata:
  name: retell-processor-secrets
  namespace: default
  labels:
    app: retell-webhook-processor
    component: secrets
type: Opaque
data:
  # Ollama API key (if required) - base64 encoded
  # Some Ollama deployments may require authentication
  # echo -n "your_ollama_api_key" | base64
  # Leave empty if not required
  OLLAMA_API_KEY: ""

  # Odoo API key - base64 encoded
  # echo -n "your_odoo_api_key" | base64
  ODOO_API_KEY: ""
---
# Alternative: Create secret using kubectl command
# This is more secure as it doesn't store credentials in YAML files
#
# kubectl create secret generic retell-webhook-secrets \
#   --from-literal=DB_USER=postgres \
#   --from-literal=DB_PASSWORD=your_secure_password \
#   --from-literal=OLLAMA_API_KEY=your_ollama_key_if_needed \
#   --namespace=default
#
# To update an existing secret:
# kubectl patch secret retell-webhook-secrets \
#   --type='json' \
#   -p='[{"op": "replace", "path": "/data/DB_PASSWORD", "value":"'$(echo -n "new_password" | base64)'"}]'
